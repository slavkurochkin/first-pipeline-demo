name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    name: api
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        working-directory: app/api
        run: uv sync --extra dev

      - name: Run tests
        working-directory: app/api
        run: uv run pytest || true
